version: 2.1

jobs:
  test:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Verify Java and run Maven integration tests
          command: |
            java -version
            chmod +x ./mvnw
            ./mvnw --batch-mode clean verify

workflows:
  test:
    jobs:
      - test
