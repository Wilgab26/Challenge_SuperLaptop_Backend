services:
  postgres:
    image: postgres:16
    container_name: slaptop-postgres
    environment:
      POSTGRES_DB: slaptop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - slaptop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slaptop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slaptop-postgres-data:
